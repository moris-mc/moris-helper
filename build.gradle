plugins { id 'java' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
 mavenCentral()
 maven { url = 'https://maven.fabricmc.net/' }
 maven { url = 'https://libraries.minecraft.net/' }
 maven { url = 'https://masa.dy.fi/maven/sakura-ryoko' }
}
sourceSets.main.java.srcDir 'src/client/java'
sourceSets.main.resources.srcDir 'src/client/resources'
def gameJar = layout.buildDirectory.file('minecraft/client-26.3.jar')
tasks.register('downloadMinecraft') {
 outputs.file gameJar
 doLast {
  def target=gameJar.get().asFile
  target.parentFile.mkdirs()
  new URI('https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar').toURL().withInputStream { input -> target.withOutputStream { it << input } }
 }
}
