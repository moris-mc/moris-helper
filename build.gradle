tasks.withType(JavaCompile).configureEach {
 dependsOn 'downloadMinecraft'
 options.encoding = 'UTF-8'
 options.release = 25
 options.compilerArgs += ['-proc:none']
}
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') {
  expand([version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]) { escapeBackslash = true }
 }
}
java { withSourcesJar() }
jar { from('LICENSE') }


jar {
 from('libs') { include 'mcef-modern-*.jar'; into 'META-INF/jars' }
 from('libs/MCEF-LICENSE.txt') { into 'META-INF/licenses' }
}

tasks.register('verifyBrowserViewport', JavaExec) {
 dependsOn testClasses
 classpath = files(sourceSets.main.output, sourceSets.test.output)
 mainClass = 'ViewportCheck'
}
check.dependsOn verifyBrowserViewport

// ViewportCheck is an executable integration check, run by verifyBrowserViewport.
test { exclude "**/ViewportCheck.class" }

